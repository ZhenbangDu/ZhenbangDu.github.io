<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title description">
  <title id="title">Transfer learning for battery state-of-health estimation</title>
  <desc id="description">Illustrative overview based on the public abstract of DOI 10.1109/TNNLS.2022.3176925: charging voltage curves are processed by a convolutional neural network, with maximum mean discrepancy used for domain adaptation, to estimate battery state of health. This schematic is not an original figure or an experimental result from the paper.</desc>
